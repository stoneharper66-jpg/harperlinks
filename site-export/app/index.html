<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>HarperLinks — Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#07070B" />
<link rel="icon" type="image/png" sizes="64x64" href="../assets/favicon-64.png" />
<style>
  :root{
    --dark:#07070B; --dtext:#F2F4FA; --dmuted:#A3A8B8;
    --head:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
    --body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    --grad:linear-gradient(100deg,#0A84FF 0%,#7B5CFF 48%,#FF2D92 100%);
    --ease-out:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;min-height:100%}
  body{background:var(--dark);color:var(--dtext);font-family:var(--body);line-height:1.6;
    -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:28px;text-align:center;position:relative;overflow:hidden}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.4px);background-size:22px 22px}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 60% 45% at 50% 35%,rgba(28,78,196,.22),transparent 70%),
               radial-gradient(ellipse 45% 35% at 72% 68%,rgba(255,45,146,.07),transparent 70%)}
  .wrap{position:relative;z-index:1;max-width:520px;animation:up .7s var(--ease-out) both}
  @keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes glow{0%,100%{filter:drop-shadow(0 0 16px rgba(10,132,255,.45)) drop-shadow(0 0 34px rgba(255,45,146,.28))}
    50%{filter:drop-shadow(0 0 30px rgba(10,132,255,.8)) drop-shadow(0 0 58px rgba(255,45,146,.5))}}
  img.logo{width:clamp(130px,22vw,180px);height:auto;display:block;margin:0 auto 6px;
    animation:float 8s 1s ease-in-out infinite,glow 4.2s ease-in-out infinite}
  h1{font-family:var(--head);font-weight:600;font-size:clamp(26px,5vw,38px);letter-spacing:-.02em;margin:0 0 14px}
  p{color:var(--dmuted);font-size:16px;margin:0 auto 10px;max-width:46ch}
  .pill{display:inline-flex;align-items:center;gap:8px;margin-bottom:24px;padding:7px 16px;border-radius:99px;
    border:1px solid rgba(110,181,255,.35);background:rgba(10,132,255,.1);color:#9ECBFF;
    font-family:var(--head);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase}
  .pill i{width:7px;height:7px;border-radius:50%;background:#FF2D92;box-shadow:0 0 10px rgba(255,45,146,.9)}
  code{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:7px;
    padding:2px 8px;font-size:14px;color:#CFE0FF}
  a.back{display:inline-block;margin-top:26px;padding:14px 28px;border-radius:14px;color:#fff;text-decoration:none;
    font-family:var(--head);font-weight:600;font-size:15.5px;background:var(--grad);
    box-shadow:0 14px 40px rgba(10,132,255,.4);transition:transform .16s var(--ease-out),box-shadow .25s}
  a.back:hover{transform:translateY(-2px);box-shadow:0 18px 50px rgba(255,45,146,.42)}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a.back.ghost{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);box-shadow:none}
  a.back.ghost:hover{background:rgba(255,255,255,.09);box-shadow:none}
  @media(prefers-reduced-motion:reduce){img.logo,.wrap{animation:none}}
</style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="../assets/logo-alpha.png" alt="HarperLinks" />
    <div class="pill"><i></i>Private beta</div>
    <h1 id="head">The dashboard isn't hosted yet.</h1>
    <p id="blurb">The HarperLinks Business OS runs on its own server, so it isn't part of this static site.</p>
    <p id="how">To use it right now, start it locally with <code>npm start</code> and open <code>localhost:4700/app</code>.</p>
    <div class="actions">
      <a class="back" href="/">Back to the site</a>
    </div>
  </div>
<script>
(function(){
  "use strict";
  // Viewing this locally? The real dashboard is probably already running on :4700 —
  // offer a button straight through to it. On a public domain we leave the page as-is.
  var local = /^(localhost|127\.0\.0\.1|\[::1\]|0\.0\.0\.0)$/.test(location.hostname);
  if(!local) return;
  var APP = location.protocol + '//' + location.hostname + ':4700/app';
  var actions = document.querySelector('.actions');
  var how = document.getElementById('how');

  var open = document.createElement('a');
  open.className = 'back';
  open.href = APP;
  open.textContent = 'Open the dashboard';
  open.style.display = 'none';
  actions.insertBefore(open, actions.firstChild);

  // only surface the button if the server actually answers
  fetch(location.protocol + '//' + location.hostname + ':4700/api/health', {mode:'no-cors'})
    .then(function(){
      open.style.display = '';
      actions.querySelector('a[href="/"]').className = 'back ghost';
      document.getElementById('head').textContent = 'Your dashboard is running.';
      document.getElementById('blurb').textContent =
        'The Business OS is live on this machine at localhost:4700 — it just isn’t part of this static site.';
      how.textContent = 'Not deployed publicly yet, so this link only works for you.';
    })
    .catch(function(){ /* server's off; the npm start instructions stand */ });
})();
</script>
</body>
</html>
